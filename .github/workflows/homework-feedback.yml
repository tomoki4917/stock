# 宿題回答（スマホから保存）の push を検知し、Gemini API で AI 添削を実行する。
#
# 事前準備:
#   - GitHub Secret: GEMINI_API_KEY（必須）
#   - GitHub Secret: GEMINI_MODEL（任意。未設定なら gemini-2.5-flash 等を自動試行）
#
# 手動テスト: Actions → Homework feedback (Gemini) → Run workflow

name: Homework feedback (Gemini)

on:
  push:
    branches: [main]
    paths:
      - "宿題/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feedback:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.head_commit.message, '宿題回答') &&
       !contains(github.event.head_commit.message, 'AIフィードバック'))
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      TZ: Asia/Tokyo
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Validate secret
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Secret GEMINI_API_KEY が未設定です。"
            exit 1
          fi

      - name: Determine changed homework files
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LATEST="$(ls -1t 宿題/*.md 2>/dev/null | head -1 || true)"
            echo "files=${LATEST}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(git show --name-only --pretty='' "${{ github.sha }}" | grep -E '^宿題/.*\.md$' || true)"
          FILES="$(echo "$FILES" | tr '\n' ' ' | xargs echo -n)"
          echo "files=${FILES}" >> "$GITHUB_OUTPUT"

      - name: Gemini feedback + commit
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: python3 .github/scripts/gemini_feedback.py
